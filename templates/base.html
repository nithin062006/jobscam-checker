<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Job Offer Checker{% endblock %}</title>
<meta name="description" content="{% block description %}Check a job offer for scam warning signs. Free, private, no sign-up.{% endblock %}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:type" content="website">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f46e5'/%3E%3Cpath d='M16 6l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V9z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M12.5 15.5l2.5 2.5 4.5-5' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="nav"><div class="in">
  <a class="brand" href="/">
    <span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V6z"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg></span>
    Job Offer Checker
  </a>
  <nav class="links"><a href="/">Check</a><a href="/scams">Common scams</a><a href="/privacy">Privacy</a></nav>
</div></header>

<main class="wrap">
{% block content %}{% endblock %}
<footer class="foot">
  <a href="/">Check an offer</a>·<a href="/scams">Common scams</a>·<a href="/privacy">Privacy &amp; disclaimer</a><br>
  Found a bug, or a scam this tool missed? Email <a href="mailto:{{ contact_email }}">{{ contact_email }}</a>
</footer>
</main>
{% block scripts %}{% endblock %}
</body>
</html>
