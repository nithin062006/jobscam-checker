<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Job Offer Checker{% endblock %}</title>
<meta name="description" content="{% block description %}Check a job offer for scam warning signs. Free, private, no sign-up.{% endblock %}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:type" content="website">
<meta name="theme-color" content="#eef1f5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a1020'/%3E%3Cpath d='M8 17l6 6 11-13' fill='none' stroke='%232f4bff' stroke-width='4' stroke-linecap='square'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
  </filter>
</svg>
<header class="top"><div class="in">
  <a class="word" href="/"><i>//</i>Job Offer Checker</a>
  <nav class="nav"><a href="/">Check</a><a href="/scams">Field guide</a><a href="/privacy">Privacy</a></nav>
</div></header>

<main class="wrap">
{% block content %}{% endblock %}
<footer class="foot">
  <a href="/">Check an offer</a><a href="/scams">Field guide</a><a href="/privacy">Privacy &amp; disclaimer</a><br><br>
  Found a bug, or a scam this tool missed? <a href="mailto:{{ contact_email }}" style="margin:0;color:var(--ink)">{{ contact_email }}</a>
</footer>
</main>
{% block scripts %}{% endblock %}
<script data-goatcounter="https://vnaganithin.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
